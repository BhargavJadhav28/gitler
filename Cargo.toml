[package]
name = "gitler"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Zero-configuration local mesh file transfer over mDNS and QUIC"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/BhargavJadhav28/gitler"
homepage = "https://github.com/BhargavJadhav28/gitler"

keywords = ["filesharing", "mdns", "p2p", "quic"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hostname = "0.4"
indicatif = "0.18"
mdns-sd = { version = "0.20.2", default-features = false, features = ["async"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.8", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
clone_on_ref_ptr = "warn"
redundant_clone = "warn"

[profile.release]
lto = "thin"
strip = true
